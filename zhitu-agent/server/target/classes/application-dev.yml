  ai:
    openai:
      # 通义千问 API Key（从 https://dashscope.console.aliyun.com/ 获取）
      api-key: sk-23d4527148b94975a2187bed378d69d7
      # 通义千问兼容模式 API 地址（注意：不要加 /v1，框架会自动添加）
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          # 模型选择: qwen-turbo / qwen-plus / qwen-max / qwen-long
          model: qwen-turbo
          # 温度参数：控制随机性 (0.0-1.0)，越高越有创造性
          temperature: 0.7
          # 最大 token 数
          max-tokens: 1000
          # 其他可选配置
          # top-p: 0.8  # 核采样参数
